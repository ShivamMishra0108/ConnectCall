name: connect_call
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  go_router: ^17.5.0
  dio: ^5.11.1
  shared_preferences: ^2.5.5
  permission_handler: 12.0.1
  intl: ^0.20.3
  flutter_webrtc: ^1.6.2+hotfix.1
  socket_io_client: ^3.1.6
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/connectcall_icon.png"
  adaptive_icon_background: "#4F46E5"
  adaptive_icon_foreground: "assets/icon/connectcall_icon.png"

flutter:
  uses-material-design: true